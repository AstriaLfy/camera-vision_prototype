# Alembic -- kerangka migrasi database.
#
# PENTING: proyek ini BELUM punya skema/model tabel. Struktur di bawah adalah
# PLACEHOLDER supaya `alembic upgrade head` bisa dijalankan dan rantai migrasi
# siap diisi saat fitur (auth, profil, subjek, sync) membutuhkan tabel. JANGAN
# menambahkan migrasi dengan skema karangan sebelum modelnya disepakati.
#
# URL database TIDAK ditulis di sini: alembic/env.py membacanya dari
# app.settings (env DATABASE_URL) supaya source-nya tunggal dengan aplikasi.

[alembic]
script_location = alembic
prepend_sys_path = .
# Dibiarkan kosong; diisi runtime oleh alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
